name: Build ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RGBDS 1.0.0
        run: |
          set -e
          # Prefer the prebuilt release; fall back to building from source.
          if curl -fsSL -o rgbds.tar.xz \
              https://github.com/gbdev/rgbds/releases/download/v1.0.0/rgbds-1.0.0-linux-x86_64.tar.xz; then
            mkdir rgbds-bin
            tar -xf rgbds.tar.xz -C rgbds-bin
            cd rgbds-bin
            sudo ./install.sh || sudo install -m 755 rgbasm rgblink rgbfix rgbgfx /usr/local/bin/
          else
            sudo apt-get update
            sudo apt-get install -y bison libpng-dev pkg-config
            curl -fsSL -o rgbds-src.tar.gz \
              https://github.com/gbdev/rgbds/archive/refs/tags/v1.0.0.tar.gz
            tar -xzf rgbds-src.tar.gz
            make -C rgbds-1.0.0 -j"$(nproc)"
            sudo make -C rgbds-1.0.0 install
          fi
          rgbasm --version

      - name: Build clean Blue Kaizo
        run: make blue -j"$(nproc)"

      - name: Build debug Blue Kaizo
        run: make blue_debug -j"$(nproc)"

      - name: Stage artifacts
        run: |
          cp pokeblue.gbc kaizo-clean.gb
          cp pokeblue_debug.gbc kaizo-debug.gb

      - name: Verify clean ROM has no debug objects
        run: |
          # The debug NPC scripts must never appear in the clean build.
          if grep -qi "DebugItemGodScript\|DebugPokemonGodScript\|DebugFlagGodScript" pokeblue.sym; then
            echo "ERROR: debug symbols leaked into the clean ROM"; exit 1
          fi
          echo "clean ROM verified free of debug objects"

      - name: Upload clean ROM
        uses: actions/upload-artifact@v4
        with:
          name: kaizo-clean
          path: kaizo-clean.gb

      - name: Upload debug ROM
        uses: actions/upload-artifact@v4
        with:
          name: kaizo-debug
          path: kaizo-debug.gb
